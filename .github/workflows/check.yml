name: CGPeers registration check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message to Telegram"
        type: boolean
        default: false
      simulate:
        description: "Simulate open registration (full alert, state untouched)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: cgp-check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check site
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_TEST: ${{ inputs.test && '1' || '0' }}
          SIMULATE: ${{ inputs.simulate && '1' || '0' }}
        run: python check.py
      - name: Save state
        run: |
          git config user.name "cgp-watcher"
          git config user.email "cgp-watcher@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update state"
          git push
